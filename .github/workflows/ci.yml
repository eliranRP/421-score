name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Reject INTERNET in merged manifest
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find app/build -path '*merged_manifest*' -name AndroidManifest.xml)
          if [[ ${#manifests[@]} -eq 0 ]]; then
            echo "No merged manifest found"
            exit 1
          fi
          if grep -n "android.permission.INTERNET" "${manifests[@]}"; then
            echo "INTERNET must not appear in the merged manifest"
            exit 1
          fi
          echo "Merged manifest is offline (no INTERNET)."
